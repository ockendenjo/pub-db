name: Sync

on:
  workflow_call:
    secrets:
      AWS_ROLE_ARN:
        required: true
      BUCKET_NAME:
        required: true

permissions:
  contents: read

jobs:
  apply:
    name: Apply
    timeout-minutes: 3
    runs-on: ubuntu-latest
    environment: pro
    permissions:
      id-token: write # OIDC authentication with AWS
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Assume role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: 'eu-west-1'
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Minify JSON
        shell: bash
        run: |
          mkdir -p output
          jq 'del(.["$schema"])' -c < ./pubs/pubs.json > output/pubs.json

      - name: S3 sync
        shell: bash
        run: |
          aws s3 sync output/ s3://${VARS_BUCKET_NAME}
        env:
          VARS_BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
