name: Build scripts

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Restore go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
          key: "go-build-${{ hashFiles('go.mod') }}"
          restore-keys: |
            go-build-

      - name: Build scripts
        shell: bash
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -o build -trimpath -buildvcs=false -ldflags="-w -s" ./scripts/check-data
          go build -o build -trimpath -buildvcs=false -ldflags="-w -s" ./scripts/build
