name: Validate

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

# JSON validation

      - name: Install JSON validator
        run: |
          wget https://github.com/neilpa/yajsv/releases/download/v1.4.1/yajsv.linux.amd64
          echo "4bd6d2b1d6292ab1f7ba63db83c182a603a790d431429cf71f05cb0fcc677def  yajsv.linux.amd64" | sha256sum -c
          chmod +x ./yajsv.linux.amd64

      - name: Validate JSON
        run: |
          ./yajsv.linux.amd64 -s schema/pubs.schema.json pubs/*/*.json

# Terraform validation

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Run script
        shell: bash
        working-directory: stack
        run: |
          terraform fmt -check -recursive
